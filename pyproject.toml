[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docbot"
version = "0.1.0"
description = "Local RAG chatbot over PDFs, images and text files (SPEC-001)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pypdf>=4.2",
    "pypdfium2>=4.30",
    "rapidocr-onnxruntime>=1.3.24",
    "fastembed>=0.3",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=8.3",
    "reportlab>=4.2",
    "pillow>=10.3",
    "pyyaml>=6.0",
    "streamlit>=1.36",
    # optional cloud generators (constitution 1.1.0)
    "openai>=3.0",
    "anthropic>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["sample_data", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # word lists read better as one split string

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
